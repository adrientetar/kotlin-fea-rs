[package]
name = "kotlin-fea-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Kotlin bindings for fea-rs, a Rust library for compiling Adobe FEA feature code"
repository = "https://github.com/adrientetar/kotlin-fea-rs"

[lib]
crate-type = ["cdylib"]
name = "kotlin_fea_rs"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.29.4", features = ["cli"] }
fea-rs = "0.22"
write-fonts = "0.44.1"
thiserror = "1.0"

[build-dependencies]
uniffi = { version = "0.29.4", features = ["build"] }

[workspace]
